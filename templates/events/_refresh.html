{% if can_sync_onedrive %}
<div class="filter-section">
  <span class="section-label">DairyComp import</span>
  <p class="meta-line">
    Reads <strong>DCEXPORTALH</strong> (split to ALH and BNK by BNAME),
    <strong>DCEXPORTSFR</strong>, <strong>DCEXPORTPRK</strong>, and
    <strong>DCEXPORTCOF</strong> from Parlours OneDrive.
    Cron also runs daily at 05:00 UK time.
  </p>
  <form
    class="js-sync-form"
    method="post"
    action="{{ url_for('sync_herd_exports') }}"
    data-sync-message="Importing DairyComp DCEXPORT files from OneDrive…"
    data-sync-poll-url="{{ url_for('events_herd_import_status') }}"
    data-sync-complete-message="Sync complete"
    data-sync-reload="true"
    {% if herd_import_status and herd_import_status.running %}data-sync-polling{% endif %}
  >
    <input type="hidden" name="next" value="{{ request.path }}">
    <button class="btn" type="submit">
      <span class="btn-label">Refresh from OneDrive</span>
      <span class="btn-busy" aria-hidden="true">
        <span class="sync-spinner"></span>
        Importing…
      </span>
    </button>
    <p class="sync-status" data-sync-status role="status" aria-live="polite">
      <span class="sync-spinner is-dark" aria-hidden="true"></span>
      <span data-sync-status-text>Importing…</span>
    </p>
  </form>
</div>
{% endif %}
