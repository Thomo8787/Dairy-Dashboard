# Render Blueprint — used by New → Blueprint, or auto-detected from this repo.
# Repo: https://github.com/Thomo8787/Dairy-Dashboard

services:
  - type: web
    name: dairy-dashboard
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-dashboard-db
          property: connectionString
      # Fill these in Render → Environment after first deploy (Azure / Outlook).
      - key: AZURE_CLIENT_ID
        value: ""
      - key: AZURE_CLIENT_SECRET
        value: ""
      - key: AZURE_TENANT_ID
        value: ""
      - key: AZURE_REDIRECT_URI
        value: ""
      - key: OUTLOOK_SENDER_FILTER
        value: ""
      - key: OUTLOOK_SUBJECT_FILTER
        value: ""
      - key: ONEDRIVE_FOLDER_PATH
        value: ""

databases:
  - name: dairy-dashboard-db
    plan: free
    databaseName: dairy_dashboard
    user: dairy_user
