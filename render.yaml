# Render Blueprint — used by New → Blueprint, or auto-detected from this repo.
# Repo: https://github.com/Thomo8787/Dairy-Dashboard

services:
  - type: web
    name: dairy-dashboard
    runtime: python
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 180 --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FLASK_DEBUG
        value: "false"
      - key: FLASK_USE_RELOADER
        value: "false"
      # In-process hourly fetch is off; Render cron jobs handle mailbox imports.
      - key: PARLOUR_HOURLY_SYNC
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-dashboard-db
          property: connectionString
      - key: GRAPH_AUTH_MODE
        value: application
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_REDIRECT_URI
        sync: false
      - key: OUTLOOK_MAILBOX
        sync: false
      - key: OUTLOOK_SENDER_FILTER
        value: ""
      - key: OUTLOOK_SUBJECT_FILTER
        value: ""
      - key: ONEDRIVE_USER
        sync: false
      - key: ONEDRIVE_SHARE_URL
        sync: false
      - key: ONEDRIVE_FOLDER_PATH
        value: ""
      - key: ONEDRIVE_FILENAME_FILTER
        value: ""
      - key: ONEDRIVE_MAX_FILES
        value: "100"
      - key: SENSEHUB_USERNAME
        sync: false
      - key: SENSEHUB_PASSWORD
        sync: false
      - key: SENSEHUB_FARM_ID
        sync: false
      # BCMS CTS / DEFRA DDTS + per-farm CTWS (set holdings for farms that report)
      - key: CTS_DDTS_USERNAME
        sync: false
      - key: CTS_DDTS_PASSWORD
        sync: false
      - key: CTS_CTWS_USERNAME_ALH
        sync: false
      - key: CTS_CTWS_PASSWORD_ALH
        sync: false
      - key: CTS_HOLDING_ALH
        sync: false
      - key: CTS_CTWS_USERNAME_BNK
        sync: false
      - key: CTS_CTWS_PASSWORD_BNK
        sync: false
      - key: CTS_HOLDING_BNK
        sync: false
      - key: CTS_CTWS_USERNAME_COF
        sync: false
      - key: CTS_CTWS_PASSWORD_COF
        sync: false
      - key: CTS_HOLDING_COF
        sync: false
      - key: CTS_CTWS_USERNAME_SFR
        sync: false
      - key: CTS_CTWS_PASSWORD_SFR
        sync: false
      - key: CTS_HOLDING_SFR
        sync: false
      - key: CTS_CTWS_USERNAME_PRK
        sync: false
      - key: CTS_CTWS_PASSWORD_PRK
        sync: false
      - key: CTS_HOLDING_PRK
        sync: false
      - key: MULLER_USERNAME
        sync: false
      - key: MULLER_PASSWORD
        sync: false
      # Home "Update herd files" starts the fetch-one-drive-data cron.
      # RENDER_HERD_CRON_ID is the crn- id from that cron's Render URL.
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_HERD_CRON_ID
        sync: false
      # Collections "Import Müller" starts the fetch-muller-collections cron.
      # RENDER_MULLER_CRON_ID is the crn- id from that cron's Render URL.
      - key: RENDER_MULLER_CRON_ID
        sync: false

  # Daily Müller weighbridge download. Render cron is UTC:
  # 06:00 UTC is 6am GMT and 7am BST. Chromium lives in Dockerfile.muller.
  - type: cron
    name: fetch-muller-collections
    runtime: docker
    plan: starter
    branch: main
    dockerfilePath: ./Dockerfile.muller
    schedule: "0 6 * * *"
    dockerCommand: python scripts/muller_download.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: MULLER_HEADLESS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-dashboard-db
          property: connectionString
      - key: MULLER_USERNAME
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: MULLER_USERNAME
      - key: MULLER_PASSWORD
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: MULLER_PASSWORD

  # Hourly DataFlow Milk Flow + Rotary Entry ID import (UTC).
  # Uses the same Azure + mailbox secrets as the web service.
  - type: cron
    name: parlour-email-sync
    runtime: python
    plan: starter
    branch: main
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/sync_parlour_emails.py --days-back 2 --farm ALL
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-dashboard-db
          property: connectionString
      - key: GRAPH_AUTH_MODE
        value: application
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: OUTLOOK_MAILBOX
        sync: false

  # Twice a day: NML milk-quality PDFs from @nationalmilklabs.com.
  # Render cron is UTC: 7am and 7pm in winter, 8am and 8pm in summer.
  # Skips emails already imported (by Outlook message ID).
  # Cattle remittances run on sales_data_cron so OCR has the whole 512MB.
  - type: cron
    name: fetch-nml-emails
    runtime: python
    plan: starter
    branch: main
    schedule: "0 7,19 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/sync_nml_emails.py --days 3
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-dashboard-db
          property: connectionString
      - key: GRAPH_AUTH_MODE
        value: application
      - key: AZURE_CLIENT_ID
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_CLIENT_ID
      - key: AZURE_CLIENT_SECRET
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_CLIENT_SECRET
      - key: AZURE_TENANT_ID
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_TENANT_ID
      - key: OUTLOOK_MAILBOX
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: OUTLOOK_MAILBOX

  # Every 3 hours, offset from the NML cron: Neilds, Pickstock, Gamechanger,
  # and Market Drayton remittances. Scanned PDFs are OCR'd one at a time.
  - type: cron
    name: sales_data_cron
    runtime: python
    plan: starter
    branch: main
    schedule: "30 */3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/sync_sales_data.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-dashboard-db
          property: connectionString
      - key: GRAPH_AUTH_MODE
        value: application
      - key: AZURE_CLIENT_ID
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_CLIENT_ID
      - key: AZURE_CLIENT_SECRET
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_CLIENT_SECRET
      - key: AZURE_TENANT_ID
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_TENANT_ID
      - key: OUTLOOK_MAILBOX
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: OUTLOOK_MAILBOX

  # One-off backfill: NML emails from 1 Apr 2026. Skips mail IDs already imported.
  # Suspend or delete this cron in Render after it has run successfully once.
  - type: cron
    name: fetch-nml-emails-from-april-2026
    runtime: python
    plan: starter
    branch: main
    schedule: "25 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/sync_nml_emails.py --since 2026-04-01
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-dashboard-db
          property: connectionString
      - key: GRAPH_AUTH_MODE
        value: application
      - key: AZURE_CLIENT_ID
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_CLIENT_ID
      - key: AZURE_CLIENT_SECRET
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_CLIENT_SECRET
      - key: AZURE_TENANT_ID
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_TENANT_ID
      - key: OUTLOOK_MAILBOX
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: OUTLOOK_MAILBOX

  # Daily DairyComp DCEXPORT import. Files land around 04:00-04:30 UK,
  # so the job is 05:00 UTC (05:00 UK in winter, 06:00 UK in summer).
  # ALHEVENTS.CSV is ~50MB; the importer retries Graph 404/timeouts.
  - type: cron
    name: fetch-one-drive-data
    runtime: python
    plan: starter
    branch: main
    schedule: "0 5 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/import_herd_exports.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-dashboard-db
          property: connectionString
      - key: GRAPH_AUTH_MODE
        value: "application"
      - key: AZURE_CLIENT_ID
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_CLIENT_ID
      - key: AZURE_CLIENT_SECRET
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_CLIENT_SECRET
      - key: AZURE_TENANT_ID
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_TENANT_ID
      - key: ONEDRIVE_USER
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: ONEDRIVE_USER
      - key: ONEDRIVE_SHARE_URL
        sync: false
      - key: ONEDRIVE_FOLDER_PATH
        value: ""

  # Home tiles after the morning imports (herd file, Müller, morning NML).
  # 08:00 UTC is 8am UK in winter and 9am UK in summer.
  - type: cron
    name: refresh-home-tiles
    runtime: python
    plan: starter
    branch: main
    schedule: "0 8 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/refresh_home_tiles.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-dashboard-db
          property: connectionString

  # SenseHub young-stock health: hourly live reading, locked at 0/6/12/18 UK.
  - type: cron
    name: fetch-sensehub-youngstock
    runtime: python
    plan: starter
    branch: main
    schedule: "10 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/import_sensehub_youngstock.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-dashboard-db
          property: connectionString
      - key: SENSEHUB_USERNAME
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: SENSEHUB_USERNAME
      - key: SENSEHUB_PASSWORD
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: SENSEHUB_PASSWORD
      - key: SENSEHUB_FARM_ID
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: SENSEHUB_FARM_ID

  # SenseHub full report refresh once a day at 6am UK.
  # Render cron is UTC-only, so run hourly and gate on Europe/London hour 6.
  - type: cron
    name: fetch-sensehub-reports
    runtime: python
    plan: starter
    branch: main
    schedule: "20 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/import_sensehub.py --only-at-uk-hours 6
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-dashboard-db
          property: connectionString
      - key: SENSEHUB_USERNAME
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: SENSEHUB_USERNAME
      - key: SENSEHUB_PASSWORD
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: SENSEHUB_PASSWORD
      - key: SENSEHUB_FARM_ID
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: SENSEHUB_FARM_ID

databases:
  - name: dairy-dashboard-db
    plan: 0.1c-256mb
    databaseName: dairy_dashboard
    user: dairy_user
