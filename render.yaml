# Render Blueprint — used by New → Blueprint, or auto-detected from this repo.
# Repo: https://github.com/Thomo8787/Dairy-Dashboard

services:
  - type: web
    name: dairy-dashboard
    runtime: python
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 180 --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FLASK_DEBUG
        value: "false"
      - key: FLASK_USE_RELOADER
        value: "false"
      # In-process hourly fetch is off; Render cron jobs handle mailbox imports.
      - key: PARLOUR_HOURLY_SYNC
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-dashboard-db
          property: connectionString
      - key: GRAPH_AUTH_MODE
        value: application
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: AZURE_REDIRECT_URI
        sync: false
      - key: OUTLOOK_MAILBOX
        sync: false
      - key: OUTLOOK_SENDER_FILTER
        value: ""
      - key: OUTLOOK_SUBJECT_FILTER
        value: ""
      - key: ONEDRIVE_USER
        sync: false
      - key: ONEDRIVE_SHARE_URL
        sync: false
      - key: ONEDRIVE_FOLDER_PATH
        value: ""
      - key: ONEDRIVE_FILENAME_FILTER
        value: ""
      - key: ONEDRIVE_MAX_FILES
        value: "100"

  # Hourly DataFlow Milk Flow + Rotary Entry ID import (UTC).
  # Uses the same Azure + mailbox secrets as the web service.
  - type: cron
    name: parlour-email-sync
    runtime: python
    plan: starter
    branch: main
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/sync_parlour_emails.py --days-back 2 --farm ALL
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-dashboard-db
          property: connectionString
      - key: GRAPH_AUTH_MODE
        value: application
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: OUTLOOK_MAILBOX
        sync: false

  # Every 3 hours: NML milk-quality PDFs from @nationalmilklabs.com.
  # Skips emails already imported (by Outlook message ID).
  - type: cron
    name: fetch-nml-emails
    runtime: python
    plan: starter
    branch: main
    schedule: "0 */3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/sync_nml_emails.py --days 3
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-dashboard-db
          property: connectionString
      - key: GRAPH_AUTH_MODE
        value: application
      - key: AZURE_CLIENT_ID
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_CLIENT_ID
      - key: AZURE_CLIENT_SECRET
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_CLIENT_SECRET
      - key: AZURE_TENANT_ID
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_TENANT_ID
      - key: OUTLOOK_MAILBOX
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: OUTLOOK_MAILBOX

  # One-off backfill: NML emails from 1 Apr 2026. Skips mail IDs already imported.
  # Suspend or delete this cron in Render after it has run successfully once.
  - type: cron
    name: fetch-nml-emails-from-april-2026
    runtime: python
    plan: starter
    branch: main
    schedule: "25 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/sync_nml_emails.py --since 2026-04-01
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-dashboard-db
          property: connectionString
      - key: GRAPH_AUTH_MODE
        value: application
      - key: AZURE_CLIENT_ID
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_CLIENT_ID
      - key: AZURE_CLIENT_SECRET
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_CLIENT_SECRET
      - key: AZURE_TENANT_ID
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_TENANT_ID
      - key: OUTLOOK_MAILBOX
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: OUTLOOK_MAILBOX

  # Daily DairyComp DCEXPORT import at 05:00 UK time.
  # Render cron is UTC: 04:00 UTC = 05:00 BST (05:00 GMT in winter would need 05:00 UTC).
  # ALHEVENTS.CSV is ~50MB and lands ~03:57 UTC; the importer retries Graph 404/timeouts.
  - type: cron
    name: fetch-one-drive-data
    runtime: python
    plan: starter
    branch: main
    schedule: "0 4 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/import_herd_exports.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-dashboard-db
          property: connectionString
      - key: GRAPH_AUTH_MODE
        value: "application"
      - key: AZURE_CLIENT_ID
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_CLIENT_ID
      - key: AZURE_CLIENT_SECRET
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_CLIENT_SECRET
      - key: AZURE_TENANT_ID
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: AZURE_TENANT_ID
      - key: ONEDRIVE_USER
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: ONEDRIVE_USER
      - key: ONEDRIVE_SHARE_URL
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: ONEDRIVE_SHARE_URL
      - key: ONEDRIVE_FOLDER_PATH
        fromService:
          type: web
          name: dairy-dashboard
          envVarKey: ONEDRIVE_FOLDER_PATH

databases:
  - name: dairy-dashboard-db
    plan: free
    databaseName: dairy_dashboard
    user: dairy_user
