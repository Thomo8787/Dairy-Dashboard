services:
  - type: web
    name: dairy-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dairy-dashboard-db
          property: connectionString
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: OUTLOOK_MAILBOX
        sync: false
      - key: OUTLOOK_SENDER_FILTER
        sync: false
      - key: OUTLOOK_SUBJECT_FILTER
        sync: false

databases:
  - name: dairy-dashboard-db
    plan: free
    databaseName: dairy_dashboard
    user: dairy_user
